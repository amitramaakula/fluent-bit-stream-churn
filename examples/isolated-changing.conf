[SERVICE]
    Flush 0.5
    Log_Level info
    HTTP_Server On
    HTTP_Listen 0.0.0.0
    HTTP_Port 2020
    scheduler.base 2
    scheduler.cap 15
[INPUT]
    Name http
    Listen 0.0.0.0
    Port 9880
    storage.type memory
    Mem_Buf_Limit 128M
[OUTPUT]
    Name cloudwatch_logs
    Alias high
    Match *
    region us-west-2
    log_group_name ${CW_LOG_GROUP}
    log_stream_name ERROR-high
    log_stream_template $high_stream
    auto_create_group false
    auto_retry_requests true
    workers 8
    Retry_Limit False
    log_suppress_interval 0
