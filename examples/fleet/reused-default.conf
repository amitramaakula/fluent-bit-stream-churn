[SERVICE]
    Flush 1
    Log_Level info
    Parsers_File /fluent-bit/etc/parsers.conf
    HTTP_Server On
    HTTP_Listen 0.0.0.0
    HTTP_Port 2020
    Health_Check On
[INPUT]
    Name tail
    Path /var/log/containers/data-*_logging-sources_*.log,/var/log/containers/${PROBE_POD}_logging-sources_*.log
    Tag kube.*
    multiline.parser cri
    Read_from_Head On
    Refresh_Interval 1
    DB /buffers/tail.db
    Mem_Buf_Limit 128M
[FILTER]
    Name kubernetes
    Match kube.*
    Kube_Tag_Prefix kube.var.log.containers.
    Merge_Log On
    Keep_Log Off
    Labels Off
    Annotations Off
[OUTPUT]
    Name cloudwatch_logs
    Alias cloud
    Match kube.*
    region us-west-2
    auto_create_group Off
    log_group_name ${CW_LOG_GROUP_PREFIX}/fallback
    log_group_template ${CW_LOG_GROUP_PREFIX}/$kubernetes['host'].$kubernetes['namespace_name']
    log_stream_name reused
