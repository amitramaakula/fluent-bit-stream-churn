[SERVICE]
    Flush 1
    Log_Level info
    Parsers_File /fluent-bit/etc/parsers.conf
    HTTP_Server On
    HTTP_Listen 0.0.0.0
    HTTP_Port 2020
    storage.path /buffers
    scheduler.base 2
    scheduler.cap 10
[INPUT]
    Name tail
    Path /var/log/containers/checkout-*_cwlogs-rollout_app-*.log
    Tag kube.*
    multiline.parser cri
    Read_from_Head On
    Refresh_Interval 1
    DB /buffers/tail.db
    storage.type filesystem
[FILTER]
    Name kubernetes
    Match kube.*
    Kube_Tag_Prefix kube.var.log.containers.
    Merge_Log On
    Keep_Log Off
    Labels Off
    Annotations Off
[FILTER]
    Name lua
    Match kube.*
    script /config/partition.lua
    call partition
[OUTPUT]
    Name cloudwatch_logs
    Match kube.*
    region ${AWS_REGION}
    log_group_name ${CW_LOG_GROUP}
    log_stream_name ERROR-pod-fallback
    log_stream_template pod-$kubernetes['pod_name']
    auto_create_group false
    workers 2
    Retry_Limit False
    storage.total_limit_size 64M
